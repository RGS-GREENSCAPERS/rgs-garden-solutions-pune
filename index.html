<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleCart Pro | Modern Fashion</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #ff3f6c;
            --bg: #ffffff;
            --card-bg: #f9f9f9;
            --text: #2d2d2d;
            --muted: #878787;
            --white: #ffffff;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body.dark-mode {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --primary: #ffffff;
        }
        body.dark-mode .cat-chip.active { color: #121212; }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--text); overflow-x: hidden;
            transition: background 0.3s ease;
        }

        /* --- Header & Navigation --- */
        header {
            position: sticky; top: 0; background: var(--bg); z-index: 100;
            padding: 12px 20px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .logo { font-size: 22px; font-weight: 900; letter-spacing: -1px; color: var(--accent); cursor: pointer; }

        .search-container { padding: 10px 20px; position: sticky; top: 58px; background: var(--bg); z-index: 99; }
        .search-bar {
            width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #ddd;
            background: var(--card-bg); color: var(--text); outline: none;
        }

        /* --- Views System --- */
        .view { display: none; padding-bottom: 80px; animation: fadeIn 0.4s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Components --- */
        .hero-slider {
            width: 100%; height: 200px; background: linear-gradient(45deg, #1a1a1a, #444);
            border-radius: 15px; margin: 10px 0; display: flex; align-items: center;
            justify-content: center; color: white; text-align: center;
            background-image: url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=800&q=80');
            background-size: cover; background-position: center;
        }

        .categories {
            display: flex; overflow-x: auto; gap: 10px; padding: 15px 0;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-chip {
            padding: 8px 18px; background: var(--card-bg); border-radius: 20px;
            white-space: nowrap; font-size: 14px; cursor: pointer; border: 1px solid transparent;
        }
        .cat-chip.active { background: var(--primary); color: var(--white); }

        /* --- Product Grid --- */
        .product-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 10px;
        }
        @media (min-width: 768px) { .product-grid { grid-template-columns: repeat(4, 1fr); } }

        .product-card {
            background: var(--card-bg); border-radius: 12px; overflow: hidden;
            position: relative; transition: var(--transition);
        }
        .product-card img { width: 100%; height: 220px; object-fit: cover; cursor: pointer; }
        .product-info { padding: 10px; }
        .product-name { font-size: 14px; font-weight: 600; margin: 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .price-row { display: flex; align-items: center; gap: 8px; }
        .curr-price { font-weight: 700; color: var(--text); }
        .old-price { text-decoration: line-through; color: var(--muted); font-size: 12px; }
        .discount { color: #03a685; font-size: 12px; font-weight: bold; }
        .wish-btn {
            position: absolute; top: 10px; right: 10px; background: white; color: #333;
            width: 30px; height: 30px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer; z-index: 2;
        }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 40px 0; color: var(--muted); }

        /* --- Details Page --- */
        .details-container { padding: 20px; }
        .details-img { width: 100%; border-radius: 15px; height: 400px; object-fit: cover; }
        .size-picker { display: flex; gap: 10px; margin: 15px 0; }
        .size-btn {
            width: 40px; height: 40px; border: 1px solid #ddd; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .size-btn.selected { border-color: var(--accent); color: var(--accent); font-weight: bold; }

        /* --- Cart & UI --- */
        .cart-item {
            display: flex; gap: 15px; padding: 15px; border-bottom: 1px solid #eee;
        }
        .cart-item img { width: 80px; height: 100px; object-fit: cover; border-radius: 8px; }
        .qty-btn { border: 1px solid #ddd; background: none; border-radius: 4px; color: var(--text); width: 28px; height: 28px; cursor: pointer; }

        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; background: var(--bg);
            display: flex; justify-content: space-around; padding: 12px;
            border-top: 1px solid rgba(0,0,0,0.1); z-index: 1000;
        }
        .nav-item { text-align: center; font-size: 20px; color: var(--muted); cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--accent); }
        .nav-item span { display: block; font-size: 10px; margin-top: 4px; font-weight: 600; }

        .btn-primary {
            width: 100%; padding: 15px; background: var(--accent); color: white;
            border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;
        }
        .badge {
            position: absolute; top: -5px; right: -5px; background: var(--accent);
            color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px;
        }

        .admin-stat { background: var(--card-bg); padding: 20px; border-radius: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="showView('home')">StyleCart Pro</div>
        <div>
            <i class="fas fa-moon" onclick="toggleDarkMode()" style="margin-right: 15px; cursor: pointer;"></i>
            <div style="position: relative; display: inline-block; cursor: pointer;" onclick="showView('cart')">
                <i class="fas fa-shopping-bag"></i>
                <span class="badge" id="cart-count">0</span>
            </div>
        </div>
    </header>

    <div class="search-container">
        <input type="text" class="search-bar" placeholder="Search for brands, products..." onkeyup="handleSearch(this.value)">
    </div>

    <div id="home" class="view active">
        <div style="padding: 0 15px;">
            <div class="hero-slider">
                <div style="background: rgba(0,0,0,0.4); width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; border-radius:15px;">
                    <h2 style="margin:0">SEASON SALE</h2>
                    <p>UP TO 50% OFF</p>
                </div>
            </div>

            <div class="categories" id="cat-list"></div>

            <h3 style="margin: 20px 0 10px;">Trending Now</h3>
            <div class="product-grid" id="main-grid"></div>
        </div>
    </div>

    <div id="details" class="view">
        <div class="details-container" id="details-content"></div>
    </div>

    <div id="wishlist" class="view">
        <div style="padding: 20px;">
            <h2>My Wishlist</h2>
            <div class="product-grid" id="wishlist-grid"></div>
        </div>
    </div>

    <div id="cart" class="view">
        <div style="padding: 20px;">
            <h2>Shopping Bag</h2>
            <div id="cart-items"></div>
            <div id="cart-summary" style="margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px;">
                <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: bold;">
                    <span>Total Amount</span>
                    <span id="total-price">₹0</span>
                </div>
                <button class="btn-primary" style="margin-top: 20px;" onclick="showView('checkout')">CHECKOUT</button>
            </div>
        </div>
    </div>

    <div id="checkout" class="view">
        <div style="padding: 20px;">
            <h2>Checkout</h2>
            <div class="admin-stat">
                <input type="text" id="co-name" class="search-bar" placeholder="Full Name" style="margin-bottom: 10px;">
                <input type="text" id="co-address" class="search-bar" placeholder="Address" style="margin-bottom: 10px;">
                <select class="search-bar" style="margin-bottom: 10px;">
                    <option>Cash on Delivery</option>
                    <option>UPI / Net Banking</option>
                </select>
                <button class="btn-primary" onclick="processOrder()">PLACE ORDER</button>
            </div>
        </div>
    </div>

    <div id="admin" class="view">
        <div style="padding: 20px;">
            <h2>Admin Dashboard</h2>
            <div class="admin-stat">Total Products: <b id="stat-p">24</b></div>
            <div class="admin-stat">Total Orders: <b>124</b></div>
            <div class="admin-stat">Total Revenue: <b>₹45,290</b></div>
            <button class="btn-primary" style="background: #333;">Add New Product</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" data-view="home" onclick="showView('home', this)"><i class="fas fa-home"></i><span>Home</span></div>
        <div class="nav-item" data-view="wishlist" onclick="showView('wishlist', this)"><i class="fas fa-heart"></i><span>Wishlist</span></div>
        <div class="nav-item" data-view="cart" onclick="showView('cart', this)"><i class="fas fa-shopping-bag"></i><span>Bag</span></div>
        <div class="nav-item" data-view="admin" onclick="showView('admin', this)"><i class="fas fa-user-shield"></i><span>Admin</span></div>
    </div>

    <script>
        // --- DATA ---
        const products = [
            { id: 1, name: "Urban Oversized Tee", price: 799, oldPrice: 1599, cat: "T-Shirts", img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400", rating: 4.5 },
            { id: 2, name: "Classic White Shirt", price: 1299, oldPrice: 2499, cat: "Shirts", img: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400", rating: 4.8 },
            { id: 3, name: "Midnight Hoodie", price: 1899, oldPrice: 3500, cat: "Hoodies", img: "https://images.unsplash.com/photo-1556821840-3a9c6a8c44a1?w=400", rating: 4.2 },
            { id: 4, name: "Denim Trucker Jacket", price: 2499, oldPrice: 4999, cat: "Jackets", img: "https://images.unsplash.com/photo-1520975916090-3105956dac38?w=400", rating: 4.7 },
            { id: 5, name: "Beige Chinos", price: 1499, oldPrice: 2999, cat: "Casual", img: "https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=400", rating: 4.3 },
            { id: 6, name: "Formal Black Blazer", price: 4500, oldPrice: 8999, cat: "Formal", img: "https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=400", rating: 4.9 },
            { id: 7, name: "Striped Summer Shirt", price: 999, oldPrice: 1999, cat: "Shirts", img: "https://images.unsplash.com/photo-1598033129183-c4f50c7176c8?w=400", rating: 4.1 },
            { id: 8, name: "Graphic Street Tee", price: 699, oldPrice: 1299, cat: "T-Shirts", img: "https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?w=400", rating: 4.4 },
            { id: 9, name: "Cargo Utility Pants", price: 1799, oldPrice: 3200, cat: "Casual", img: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=400", rating: 4.6 },
            { id: 10, name: "Leather Biker Jacket", price: 5999, oldPrice: 9999, cat: "Jackets", img: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=400", rating: 5.0 },
            { id: 11, name: "Slim Fit Oxford", price: 1599, oldPrice: 2999, cat: "Formal", img: "https://images.unsplash.com/photo-1588359348347-9bc6cbb6cf97?w=400", rating: 4.5 },
            { id: 12, name: "Pastel Mint Hoodie", price: 1699, oldPrice: 2800, cat: "Hoodies", img: "https://images.unsplash.com/photo-1544441893-675973e31985?w=400", rating: 4.2 }
        ];
        // Populate more dynamically for the demo
        for (let i = 13; i <= 24; i++) {
            products.push({ ...products[i % 6], id: i, name: products[i % 6].name + " V" + i });
        }

        const categories = ["All", "Formal", "Casual", "T-Shirts", "Shirts", "Hoodies", "Jackets"];
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
        let currentCat = "All";
        let currentView = "home";

        // --- CORE LOGIC ---
        function init() {
            if (localStorage.getItem('dark') === '1') document.body.classList.add('dark-mode');
            renderCategories();
            renderProducts(products);
            updateCartBadge();
            document.getElementById('stat-p').innerText = products.length;
        }

        function renderCategories() {
            const catContainer = document.getElementById('cat-list');
            catContainer.innerHTML = categories.map(cat =>
                `<div class="cat-chip ${cat === 'All' ? 'active' : ''}" onclick="filterCat('${cat}', this)">${cat}</div>`
            ).join('');
        }

        function renderProducts(list, target = 'main-grid') {
            const grid = document.getElementById(target);
            if (list.length === 0) {
                grid.innerHTML = `<div class="empty-state"><i class="fas fa-heart-crack fa-2x"></i><p>Nothing here yet</p></div>`;
                return;
            }
            grid.innerHTML = list.map(p => {
                const isWished = wishlist.includes(p.id) ? 'fas' : 'far';
                const disc = Math.round(((p.oldPrice - p.price) / p.oldPrice) * 100);
                return `
                <div class="product-card">
                    <div class="wish-btn" onclick="toggleWish(${p.id}, event)">
                        <i class="${isWished} fa-heart" style="color:${isWished === 'fas' ? '#ff3f6c' : ''}"></i>
                    </div>
                    <img src="${p.img}" alt="${p.name}" onclick="viewDetails(${p.id})">
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="price-row">
                            <span class="curr-price">₹${p.price}</span>
                            <span class="old-price">₹${p.oldPrice}</span>
                            <span class="discount">${disc}% OFF</span>
                        </div>
                        <div style="font-size:11px; color:#ffa41c; margin-top:5px;">
                            <i class="fas fa-star"></i> ${p.rating} | 2.1k reviews
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function filterCat(cat, el) {
            currentCat = cat;
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            const filtered = cat === 'All' ? products : products.filter(p => p.cat === cat);
            renderProducts(filtered);
        }

        function handleSearch(q) {
            if (currentView !== 'home') showView('home', document.querySelector('.nav-item[data-view="home"]'));
            const base = currentCat === 'All' ? products : products.filter(p => p.cat === currentCat);
            const filtered = base.filter(p => p.name.toLowerCase().includes(q.toLowerCase()));
            renderProducts(filtered);
        }

        function showView(viewId, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            currentView = viewId;

            // Keep bottom nav highlight in sync, even when navigating from header/buttons
            document.querySelectorAll('.nav-item').forEach(n => {
                n.classList.toggle('active', n.dataset.view === viewId);
            });

            if (viewId === 'cart') renderCart();
            if (viewId === 'wishlist') renderProducts(products.filter(p => wishlist.includes(p.id)), 'wishlist-grid');
            window.scrollTo(0, 0);
        }

        function viewDetails(id) {
            const p = products.find(x => x.id === id);
            const content = document.getElementById('details-content');
            content.innerHTML = `
                <i class="fas fa-arrow-left" onclick="showView('home')" style="margin-bottom:20px; cursor:pointer"></i>
                <img src="${p.img}" class="details-img" alt="${p.name}">
                <h1>${p.name}</h1>
                <div class="price-row" style="font-size:24px">
                    <span class="curr-price">₹${p.price}</span>
                    <span class="old-price">₹${p.oldPrice}</span>
                </div>
                <p style="color:var(--muted)">Modern style meets comfort. This premium fabric item is perfect for daily wear and special occasions.</p>

                <h3>Select Size</h3>
                <div class="size-picker">
                    <div class="size-btn" onclick="selectSize(this)">S</div>
                    <div class="size-btn selected" onclick="selectSize(this)">M</div>
                    <div class="size-btn" onclick="selectSize(this)">L</div>
                    <div class="size-btn" onclick="selectSize(this)">XL</div>
                </div>

                <div style="display:flex; gap:10px; margin-top:30px;">
                    <button class="btn-primary" onclick="addToCart(${p.id})" style="background:#333">ADD TO BAG</button>
                    <button class="btn-primary" onclick="addToCart(${p.id}, true)">BUY NOW</button>
                </div>
            `;
            showView('details');
        }

        function selectSize(el) {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
        }

        // --- WISHLIST ---
        function toggleWish(id, event) {
            if (event) event.stopPropagation();
            if (wishlist.includes(id)) wishlist = wishlist.filter(x => x !== id);
            else wishlist.push(id);
            localStorage.setItem('wishlist', JSON.stringify(wishlist));

            if (currentView === 'wishlist') {
                renderProducts(products.filter(p => wishlist.includes(p.id)), 'wishlist-grid');
            } else {
                const base = currentCat === 'All' ? products : products.filter(p => p.cat === currentCat);
                renderProducts(base);
            }
        }

        // --- STORAGE / CART LOGIC ---
        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        function updateCartBadge() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-count').innerText = count;
        }

        function addToCart(id, goToCart = false) {
            const p = products.find(x => x.id === id);
            const size = document.querySelector('.size-btn.selected');
            const exists = cart.find(item => item.id === id);
            if (exists) exists.qty++;
            else cart.push({ ...p, qty: 1, size: size ? size.innerText : 'M' });

            saveCart();
            updateCartBadge();
            if (goToCart) showView('cart');
            else alert("Added to Bag!");
        }

        function updateQty(id, delta) {
            const item = cart.find(x => x.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty < 1) cart = cart.filter(x => x.id !== id);
            saveCart();
            renderCart();
            updateCartBadge();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:50px 0;"><i class="fas fa-shopping-bag fa-3x" style="color:#ddd"></i><p>Your bag is empty</p></div>`;
                document.getElementById('cart-summary').style.display = 'none';
                return;
            }
            document.getElementById('cart-summary').style.display = 'block';
            let total = 0;
            container.innerHTML = cart.map(item => {
                total += (item.price * item.qty);
                return `
                <div class="cart-item">
                    <img src="${item.img}" alt="${item.name}">
                    <div style="flex:1">
                        <div style="font-weight:600">${item.name}</div>
                        <div style="font-size:12px; color:var(--muted)">Size: ${item.size || 'M'}</div>
                        <div style="font-size:14px; color:var(--accent)">₹${item.price}</div>
                        <div style="margin-top:10px; display:flex; align-items:center; gap:15px;">
                            <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                    <i class="fas fa-trash" onclick="updateQty(${item.id}, -100)" style="color:#bbb; cursor:pointer"></i>
                </div>`;
            }).join('');
            document.getElementById('total-price').innerText = '₹' + total.toLocaleString('en-IN');
        }

        // --- CHECKOUT ---
        function processOrder() {
            const name = document.getElementById('co-name').value.trim();
            const address = document.getElementById('co-address').value.trim();
            if (cart.length === 0) { alert("Your bag is empty."); return; }
            if (!name || !address) { alert("Please enter your name and address."); return; }

            cart = [];
            saveCart();
            updateCartBadge();
            document.getElementById('co-name').value = '';
            document.getElementById('co-address').value = '';
            alert("Order placed successfully! Thank you, " + name + ".");
            showView('home');
        }

        // --- THEME ---
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('dark', document.body.classList.contains('dark-mode') ? '1' : '0');
        }

        init();
    </script>
</body>
</html>
